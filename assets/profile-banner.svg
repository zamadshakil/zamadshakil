      <circle cx="899" cy="81" r="4" fill="#F08068" stroke="none" />
      <circle cx="890" cy="96" r="4" fill="#F6C453" stroke="none" />
      <circle cx="908" cy="96" r="4" fill="#9AD9CE" stroke="none" />
      <path d="M896 85L892 92M902 85L906 92M894 96H904" stroke="#DDF0EC" stroke-width="1.5" />

