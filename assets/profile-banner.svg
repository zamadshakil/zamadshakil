    <rect x="70" y="57" width="34" height="4" rx="2" fill="#F6C453" />
    <text x="118" y="64" fill="#B8E0D7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">FOUNDER · AI ENGINEER · PRODUCT BUILDER</text>

    <text x="67" y="158" fill="#FFF9EE" font-family="Arial, Helvetica, sans-serif" font-size="69" font-weight="700" letter-spacing="-2.4">Zamad Shakeel</text>
    <text x="70" y="208" fill="#D5E6E1" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="-0.25">I architect AI systems and software that survive production.</text>

    <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0.9">
