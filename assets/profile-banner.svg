      <circle cx="169" cy="254" r="3" fill="#F08068" />
      <text x="186" y="259" fill="#FFF9EE">FULL-STACK SAAS</text>
      <circle cx="330" cy="254" r="3" fill="#F08068" />
      <text x="347" y="259" fill="#FFF9EE">SECURE SYSTEMS</text>
