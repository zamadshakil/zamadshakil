<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Zamad Shakeel</title>
  <desc id="desc">Founder, AI product engineer, and full-stack builder</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEFDFB" />
      <stop offset="100%" stop-color="#F6F3ED" />
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#5147D9" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#332E7A" flood-opacity="0.14" />
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="26" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#paper)" />

    <!-- Quiet editorial details -->
    <circle cx="1190" cy="-8" r="166" fill="#EDEAFE" />
    <circle cx="1152" cy="334" r="86" fill="#FFD9CC" fill-opacity="0.66" />
    <path d="M818 0V360" stroke="#E7E3DA" />

    <!-- Identity -->
    <rect x="70" y="59" width="34" height="4" rx="2" fill="#6257ED" />
    <text x="118" y="66" fill="#6257ED" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">FOUNDER · ENGINEER · BUILDER</text>

    <text x="67" y="161" fill="#18181B" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" letter-spacing="-2.5">Zamad Shakeel</text>
    <text x="70" y="211" fill="#4F5663" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" letter-spacing="-0.3">Designing dependable AI products, from idea to production.</text>

    <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0.7">
      <text x="70" y="264" fill="#25252A">AI SYSTEMS</text>
      <circle cx="174" cy="259" r="3" fill="#FF896A" />
      <text x="191" y="264" fill="#25252A">SAAS PRODUCTS</text>
      <circle cx="323" cy="259" r="3" fill="#FF896A" />
      <text x="340" y="264" fill="#25252A">SECURE AUTOMATION</text>
    </g>

    <circle cx="74" cy="309" r="4" fill="#6257ED" />
    <text x="90" y="314" fill="#737782" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">LAHORE  →  WORLDWIDE</text>

    <!-- Modern monogram composition -->
    <g filter="url(#shadow)">
      <rect x="925" y="87" width="188" height="188" rx="52" fill="url(#violet)" transform="rotate(7 1019 181)" />
    </g>
    <circle cx="1110" cy="82" r="19" fill="#FF896A" />
    <circle cx="914" cy="280" r="11" fill="#F4C95D" />
    <path d="M922 105C967 59 1048 43 1115 68" fill="none" stroke="#B8B2FF" stroke-width="2" stroke-linecap="round" />
    <text x="1019" y="201" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-3" text-anchor="middle">ZS</text>
    <text x="1019" y="229" fill="#DCD9FF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" text-anchor="middle">ZAMDEV AI</text>

    <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="25.25" fill="none" stroke="#E2DED5" stroke-width="1.5" />
  </g>
</svg>
