      <ellipse cx="908" cy="272" rx="10" ry="4" stroke="#FFF9EE" stroke-width="1.8" />
      <path d="M898 272V287C898 289 903 291 908 291C913 291 918 289 918 287V272M898 279C898 281 903 283 908 283C913 283 918 281 918 279" stroke="#FFF9EE" stroke-width="1.8" />

