      <path d="M1095 285H1119C1123 285 1125 282 1125 279C1125 275 1122 272 1118 272C1116 267 1111 265 1107 267C1103 267 1100 270 1099 274C1095 274 1092 277 1092 280C1092 283 1094 285 1095 285Z" stroke="#FFF9EE" stroke-width="1.8" />

