    <circle cx="74" cy="309" r="4" fill="#F6C453" />
    <text x="90" y="314" fill="#A9CCC5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">LAHORE  →  WORLDWIDE</text>

    <!-- AI product architecture map -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="1013" cy="180" r="128" stroke="#9AD9CE" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="3 9" />
      <circle cx="1013" cy="180" r="94" stroke="#9AD9CE" stroke-opacity="0.16" />

