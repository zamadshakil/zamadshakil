      <stop offset="58%" stop-color="#1D4A4B" />
      <stop offset="100%" stop-color="#285C59" />
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD36A" />
      <stop offset="100%" stop-color="#F0AE3D" />
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="26" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#ground)" />

    <!-- Soft depth, without a grid or terminal aesthetic -->
    <circle cx="1136" cy="-52" r="188" fill="#4E7E75" fill-opacity="0.23" />
    <circle cx="1210" cy="374" r="176" fill="#0D3033" fill-opacity="0.22" />
    <path d="M0 319C235 283 475 353 721 315C890 289 1025 283 1200 301V360H0Z" fill="#0F3437" fill-opacity="0.22" />

