      <text x="1121" y="122">RAG</text>
      <text x="1147" y="218">APIs</text>
      <text x="1107" y="319">CLOUD</text>
      <text x="908" y="318">DATA</text>
      <text x="873" y="218">DEV</text>
    </g>

    <!-- AI core -->
    <circle cx="1013" cy="180" r="55" fill="url(#core)" />
    <circle cx="1013" cy="180" r="48" fill="none" stroke="#FFF3CF" stroke-opacity="0.72" />
    <text x="1013" y="190" fill="#173C3F" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-2" text-anchor="middle">AI</text>
    <text x="1013" y="208" fill="#735A24" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="1.8" text-anchor="middle">SYSTEMS</text>

    <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="25.25" fill="none" stroke="#6E9991" stroke-opacity="0.62" stroke-width="1.5" />
